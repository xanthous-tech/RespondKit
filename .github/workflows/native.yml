name: Native SDKs
on:
  pull_request:
    paths: ["Package.swift", "VERSION", "native/**", ".github/workflows/native.yml"]
  push:
    branches: [main]
    paths: ["Package.swift", "VERSION", "native/**", ".github/workflows/native.yml"]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: xcodebuild -scheme RespondKitUI -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: native/android/gradlew -p native/android :core:test :compose:assembleDebug :example:assembleDebug --console=plain
