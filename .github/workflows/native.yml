name: Native SDKs
on:
  pull_request:
    paths:
      [
        "Package.swift",
        "VERSION",
        "native/**",
        "packages/react-native/**",
        "apps/native-example/**",
        ".github/workflows/native.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "Package.swift",
        "VERSION",
        "native/**",
        "packages/react-native/**",
        "apps/native-example/**",
        ".github/workflows/native.yml",
      ]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: xcodebuild -scheme RespondKitUI -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: native/android/gradlew -p native/android :core:test :compose:assembleDebug :example:assembleDebug --console=plain

  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp -C packages/react-native test
      - run: mkdir -p artifacts/react-native
      - run: vp -C apps/native-example run bundle:android
      - run: vp -C apps/native-example run bundle:ios
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: apps/native-example/android/gradlew -p apps/native-example/android :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --console=plain
