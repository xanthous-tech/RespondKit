name: Workspace checks
on:
  pull_request:
    paths:
      [
        "apps/api/**",
        "apps/web/**",
        "packages/**",
        "localization/**",
        "scripts/generate-localizations.ts",
        "scripts/publish-npm.mjs",
        "scripts/lib/npm-release.mjs",
        "scripts/npm-release.test.mjs",
        "package.json",
        "pnpm-lock.yaml",
        ".github/workflows/checks.yml",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run ready
